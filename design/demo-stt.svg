<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" font-family="-apple-system, 'Segoe UI', Roboto, system-ui, sans-serif" role="img" aria-label="Speech to text: the pill records, then the text is pasted into your editor">
  <defs>
    <clipPath id="sttType"><rect x="92" y="124" width="0" height="26">
      <animate attributeName="width" values="0;0;0;212;212;0" keyTimes="0;0.16;0.44;0.8;0.95;1" dur="6.5s" repeatCount="indefinite"/>
    </rect></clipPath>
    <filter id="pillShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16243f" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="718" height="198" rx="16" fill="#FBFCFD" stroke="#E7EBEF"/>
  <text x="28" y="32" fill="#8794A1" font-size="12" font-weight="600">SPEECH → TEXT</text>

  <!-- editor window (where the text gets pasted) -->
  <rect x="70" y="70" width="580" height="112" rx="12" fill="#fff" stroke="#E2E6EB"/>
  <circle cx="88" cy="88" r="4" fill="#FF5F57"/><circle cx="102" cy="88" r="4" fill="#FEBC2E"/><circle cx="116" cy="88" r="4" fill="#28C840"/>
  <g clip-path="url(#sttType)">
    <text x="92" y="144" fill="#2B333C" font-size="18" font-weight="500">Ship the beta on Friday.</text>
  </g>
  <rect y="126" width="2" height="24" fill="#2E7BE0">
    <animate attributeName="x" values="92;92;92;304;304;92" keyTimes="0;0.16;0.44;0.8;0.95;1" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- the real pill (floating above the editor) -->
  <rect x="286" y="48" width="150" height="46" rx="23" fill="#1B1B1D" filter="url(#pillShadow)"/>

  <!-- pill state A: recording (mic + white waveform) -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.38;0.42;0.9;0.95;1" dur="6.5s" repeatCount="indefinite"/>
    <g transform="translate(305,71)" fill="#fff">
      <rect x="-4" y="-9" width="8" height="13" rx="4"/>
      <path d="M-7 -1 a7 7 0 0 0 14 0" fill="none" stroke="#fff" stroke-width="1.7"/>
      <line x1="0" y1="6" x2="0" y2="10" stroke="#fff" stroke-width="1.7"/>
    </g>
    <g fill="#fff">
      <rect x="330" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" repeatCount="indefinite"/></rect>
      <rect x="341" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" begin="0.1s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" begin="0.1s" repeatCount="indefinite"/></rect>
      <rect x="352" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="363" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="374" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="385" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" begin="0.5s" repeatCount="indefinite"/></rect>
      <rect x="396" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="407" width="3.4" rx="1.7"><animate attributeName="height" values="5;19;9;15;5" dur="0.85s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="68.5;61.5;66.5;63.5;68.5" dur="0.85s" begin="0.7s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- pill state B: result (green check) -->
  <text x="361" y="79" text-anchor="middle" font-size="22" font-weight="700" fill="#46D17F" opacity="0">✓
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.46;0.9;0.95;1" dur="6.5s" repeatCount="indefinite"/>
  </text>

  <!-- copy pill (round) pops next to it on result -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.5;0.9;0.95;1" dur="6.5s" repeatCount="indefinite"/>
    <circle cx="458" cy="71" r="20" fill="#1B1B1D" filter="url(#pillShadow)"/>
    <g transform="translate(458,71)" fill="#1B1B1D" stroke="#fff" stroke-width="1.6">
      <rect x="-6" y="-5" width="8" height="10" rx="2"/>
      <rect x="-2" y="-2" width="8" height="10" rx="2"/>
    </g>
  </g>

  <text x="286" y="120" fill="#8794A1" font-size="12.5">double-tap Control, then talk</text>
</svg>
