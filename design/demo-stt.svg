<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" font-family="-apple-system, 'Segoe UI', Roboto, system-ui, sans-serif" role="img" aria-label="Speech to text: double-tap Control, talk, text is pasted at the cursor">
  <defs>
    <clipPath id="sttType"><rect x="378" y="58" width="0" height="40" rx="4">
      <animate attributeName="width" values="0;0;214;214;0" keyTimes="0;0.16;0.6;0.92;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect x="1" y="1" width="718" height="178" rx="16" fill="#FBFCFD" stroke="#E7EBEF"/>
  <text x="28" y="34" fill="#8794A1" font-size="12" font-weight="600">SPEECH → TEXT</text>

  <!-- mic + pulsing rings -->
  <g transform="translate(84,98)">
    <circle r="22" fill="none" stroke="#2E7BE0" stroke-width="2">
      <animate attributeName="r" values="22;48" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="none" stroke="#2E7BE0" stroke-width="2">
      <animate attributeName="r" values="22;48" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="24" fill="#2E7BE0"/>
    <rect x="-5" y="-13" width="10" height="16" rx="5" fill="#fff"/>
    <path d="M-9 -2 a9 9 0 0 0 18 0" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="7" x2="0" y2="12" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- key chip -->
  <g transform="translate(146,84)">
    <rect width="150" height="30" rx="8" fill="#2A2622"/>
    <text x="75" y="20" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="600">⌃ ⌃  double-tap</text>
  </g>
  <text x="146" y="140" fill="#8794A1" font-size="12.5">Double-tap Control, then talk</text>

  <!-- arrow -->
  <path d="M312 99 h34" stroke="#C7CDD4" stroke-width="2" fill="none"/>
  <path d="M344 94 l8 5 l-8 5 z" fill="#C7CDD4"/>

  <!-- text field with typing reveal + caret -->
  <rect x="366" y="50" width="326" height="56" rx="10" fill="#fff" stroke="#D7DDE5"/>
  <g clip-path="url(#sttType)">
    <text x="382" y="84" fill="#2B333C" font-size="17" font-weight="500">Ship the beta on Friday.</text>
  </g>
  <rect y="62" width="2" height="32" fill="#2E7BE0">
    <animate attributeName="x" values="382;382;596;596;382" keyTimes="0;0.16;0.6;0.92;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- status -->
  <text x="366" y="134" font-size="12.5" font-weight="600" fill="#1FA463">✓ pasted at the cursor
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.16;0.62;0.7;0.92;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
