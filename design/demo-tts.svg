<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" font-family="-apple-system, 'Segoe UI', Roboto, system-ui, sans-serif" role="img" aria-label="Text to speech: select text, the pill reads it aloud word by word">
  <defs>
    <clipPath id="ttsRead"><rect x="92" y="116" width="0" height="24">
      <animate attributeName="width" values="0;0;0;214;214;0" keyTimes="0;0.2;0.46;0.86;0.95;1" dur="6.5s" repeatCount="indefinite"/>
    </rect></clipPath>
    <filter id="pillShadow2" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16243f" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="718" height="198" rx="16" fill="#FBFCFD" stroke="#E7EBEF"/>
  <text x="28" y="32" fill="#8794A1" font-size="12" font-weight="600">TEXT → SPEECH</text>

  <!-- document window -->
  <rect x="70" y="62" width="580" height="106" rx="12" fill="#fff" stroke="#E2E6EB"/>
  <circle cx="88" cy="80" r="4" fill="#FF5F57"/><circle cx="102" cy="80" r="4" fill="#FEBC2E"/><circle cx="116" cy="80" r="4" fill="#28C840"/>

  <text x="92" y="108" fill="#B8AEA0" font-size="13">Meeting notes — Q3</text>
  <!-- selection highlight sweeps in -->
  <rect x="90" y="117" width="0" height="24" rx="3" fill="#BFD9FF">
    <animate attributeName="width" values="0;0;218;218;218;0" keyTimes="0;0.16;0.44;0.9;0.96;1" dur="6.5s" repeatCount="indefinite"/>
  </rect>
  <text x="92" y="134" fill="#2B333C" font-size="17" font-weight="500">We ship the beta on Friday.</text>
  <!-- karaoke (blue) reveal as it reads -->
  <g clip-path="url(#ttsRead)">
    <text x="92" y="134" fill="#2E7BE0" font-size="17" font-weight="600">We ship the beta on Friday.</text>
  </g>
  <text x="92" y="160" fill="#B8AEA0" font-size="13">Follow up with the design team.</text>

  <!-- the real pill (floating), speaking state: speaker icon + white waveform -->
  <rect x="286" y="40" width="150" height="46" rx="23" fill="#1B1B1D" filter="url(#pillShadow2)"/>
  <g transform="translate(305,63)" fill="#fff">
    <path d="M-9 -5 h5 l6 -5 v20 l-6 -5 h-5 z"/>
    <path d="M4 -5 a7 7 0 0 1 0 10" fill="none" stroke="#fff" stroke-width="1.6"/>
    <path d="M8 -9 a12 12 0 0 1 0 18" fill="none" stroke="#fff" stroke-width="1.6"/>
  </g>
  <g fill="#fff">
    <rect x="332" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="343" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" begin="0.1s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" begin="0.1s" repeatCount="indefinite"/></rect>
    <rect x="354" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="365" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="376" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="387" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="398" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="409" width="3.4" rx="1.7"><animate attributeName="height" values="5;18;9;15;5" dur="0.8s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="60.5;54;58.5;55.5;60.5" dur="0.8s" begin="0.7s" repeatCount="indefinite"/></rect>
  </g>

  <text x="460" y="67" fill="#8794A1" font-size="12.5">double-tap right ⌘ to read aloud</text>
</svg>
